<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inburgering — Dutch A1→A2 Trainer</title>
<style>
/* ---------- Design tokens ----------
   Subject: Dutch civic integration. Signature look pulls from the
   NS / Dutch wayfinding world — signal yellow, ink navy, route lines.
   Not a cream-serif-terracotta template; this is a transit-board identity. */
:root{
  --ink:#15233b;          /* deep navy ink */
  --ink-soft:#46546e;
  --paper:#f6f4ee;        /* warm off-white */
  --card:#ffffff;
  --line:#dcd8cc;
  --signal:#ffcf2d;       /* NS-ish signal yellow */
  --signal-deep:#e7a500;
  --route:#1f6feb;        /* route blue */
  --good:#1f9d6b;
  --bad:#d6453d;
  --shadow:0 1px 0 rgba(21,35,59,.04), 0 8px 24px -16px rgba(21,35,59,.45);
  --r:16px;
  font-synthesis:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:16px;}

/* ---------- App frame ---------- */
.wrap{max-width:680px;margin:0 auto;padding:0 16px 120px;}

/* ---------- Top bar: a transit destination board ---------- */
.board{
  background:var(--ink);
  color:#fff;
  border-radius:0 0 22px 22px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 18px;
  margin:0 -16px 18px;
  position:relative;
  overflow:hidden;
}
.board::after{ /* route line motif */
  content:"";position:absolute;left:18px;right:18px;bottom:12px;height:2px;
  background:repeating-linear-gradient(90deg,var(--signal) 0 14px,transparent 14px 22px);
  opacity:.5;
}
.board-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);font-weight:600;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px rgba(255,207,45,.18);}
.board h1{font-size:23px;margin-top:10px;color:#fff;}
.board .sub{color:#aeb9cd;font-size:13.5px;margin-top:3px;}

/* profile + level controls */
.controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:11px;padding:3px;gap:2px;}
.seg button{padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:#c4cdde;transition:.15s;}
.seg button.on{background:var(--signal);color:var(--ink);}
.seg.level button.on{background:var(--route);color:#fff;}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{white-space:nowrap;padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.tab .lock{opacity:.5;font-size:11px;}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
.card h2{font-size:17px;display:flex;align-items:center;gap:8px;}
.eyebrow{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--signal-deep);font-weight:700;}
.muted{color:var(--ink-soft);font-size:14px;}

/* progress rails */
.rail{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px;margin:9px 0;font-size:13.5px;}
.rail .track{height:8px;background:#eceae2;border-radius:99px;overflow:hidden;}
.rail .fill{height:100%;background:linear-gradient(90deg,var(--route),#3c8aff);border-radius:99px;transition:width .4s;}
.rail .pct{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-soft);font-weight:600;}

/* stat chips */
.stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat{flex:1;min-width:90px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;}
.stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat .l{font-size:12px;color:var(--ink-soft);}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px;background:var(--ink);color:#fff;transition:.12s;}
.btn:active{transform:translateY(1px);}
.btn.signal{background:var(--signal);color:var(--ink);}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn.block{width:100%;}
.btn.sm{padding:9px 12px;font-size:14px;}
.row{display:flex;gap:9px;flex-wrap:wrap;}

/* checklist */
.check{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);}
.check:last-child{border-bottom:none;}
.check input{width:21px;height:21px;accent-color:var(--route);flex:none;}
.check.done span{text-decoration:line-through;color:var(--ink-soft);}

/* flashcard */
.flash{perspective:1200px;}
.flash-inner{position:relative;min-height:200px;border-radius:18px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.flash-inner.flip{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;padding:24px;text-align:center;}
.face.front{background:var(--ink);color:#fff;}
.face.back{background:var(--signal);color:var(--ink);transform:rotateY(180deg);}
.face .word{font-size:30px;font-weight:800;letter-spacing:-.02em;}
.face .topic{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:10px;}
.face .hint{position:absolute;bottom:14px;font-size:12px;opacity:.6;}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.grade button{padding:13px 6px;border-radius:12px;font-weight:700;font-size:14px;color:#fff;}
.g-again{background:var(--bad);}
.g-hard{background:var(--signal-deep);}
.g-good{background:var(--good);}

/* quiz */
.opt{display:block;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:9px;font-size:15px;background:var(--card);transition:.12s;}
.opt:active{transform:scale(.99);}
.opt.correct{border-color:var(--good);background:#eafaf2;}
.opt.wrong{border-color:var(--bad);background:#fdecea;}
.opt.dim{opacity:.55;}
.why{font-size:13.5px;color:var(--ink-soft);background:var(--paper);border-left:3px solid var(--signal);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:6px;}
.passbar{font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;display:inline-block;}
.passbar.pass{background:#eafaf2;color:var(--good);}
.passbar.fail{background:#fdecea;color:var(--bad);}

/* reading/listening text block */
.passage{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;margin-bottom:12px;}
.speak-prompt{font-size:18px;font-weight:600;padding:18px;background:var(--paper);border-radius:12px;border:1px solid var(--line);margin-bottom:12px;}

/* roadmap */
.leg{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.leg:last-child{border-bottom:none;}
.leg .wk{font-weight:800;font-size:13px;color:var(--route);font-variant-numeric:tabular-nums;}
.leg .focus{font-size:14.5px;font-weight:600;}
.leg .part{font-size:12px;color:var(--ink-soft);margin-top:2px;}

textarea.write{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:12px;resize:vertical;}

.locked-note{text-align:center;padding:30px 16px;color:var(--ink-soft);}
.locked-note .big{font-size:40px;}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0;}
.tiny{font-size:12px;color:var(--ink-soft);}
.kbd{font-variant-numeric:tabular-nums;font-weight:700;}
/* glossary rows */
.wrow{display:grid;grid-template-columns:34px 1fr 18px;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);}
.wrow:last-child{border-bottom:none;}
.wrow .spk{font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;}
.wrow .spk:active{transform:scale(.92);}
.wpair{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.wprim{font-weight:700;font-size:15.5px;}
.warrow{color:var(--signal-deep);font-size:13px;}
.wsec{color:var(--ink-soft);font-size:14.5px;}
.wknown{color:var(--good);font-weight:800;text-align:center;}
/* inline gloss strip on quiz/prompt tabs */
.gloss{margin:0 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden;}
.gloss summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-soft);list-style:none;}
.gloss summary::-webkit-details-marker{display:none;}
.gloss summary::before{content:"📖 ";}
.glist{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px;}
.gitem{font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;}
.gitem b{color:var(--ink);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

</div>

/* ====== Level mapping ====== */
function vocabForLevel(lvl){
  // A1 deck = words tagged A1. A2 deck = everything (A1 + A2-tagged).
  return lvl === "A1" ? VOCAB.filter(v=>v.lvl==="A1") : VOCAB.slice();
}

/* Build a quick lookup of single Dutch words -> English (strip articles). */
const GLOSS = (()=>{
  const m={};
  VOCAB.forEach(v=>{
    const key=v.nl.replace(/^(de|het|een)\s+/i,"").toLowerCase();
    if(!m[key]) m[key]=v.en;
    if(!m[v.nl.toLowerCase()]) m[v.nl.toLowerCase()]=v.en;
  });
  return m;
})();
/* From a chunk of Dutch text, pull the dictionary words found in it. */
function glossFrom(text){
  const seen=new Set(), out=[];
  (text.toLowerCase().match(/[a-zà-ÿ]+/gi)||[]).forEach(w=>{
    if(GLOSS[w] && !seen.has(w)){ seen.add(w); out.push([w,GLOSS[w]]); }
  });
  return out.slice(0,8); // keep it tidy
}

/* ====== Auto-save ======
   Saves to the device automatically after every change. Uses localStorage
   when the browser allows it (it does once the file is downloaded/opened
   normally); falls back silently to memory-only if storage is blocked
   (e.g. inside a sandboxed preview). Export/Import remains as a manual
   backup and for moving to a new phone. */
const STORE_KEY = "inburgering_trainer_v1";
let STORAGE_OK = false;
try {
  const t = "__t"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t);
  STORAGE_OK = true;
} catch(e){ STORAGE_OK = false; }

function snapshot(){ return JSON.stringify(STATE); }

function save(){               // called after every state mutation
  if(!STORAGE_OK) return;
  try { window.localStorage.setItem(STORE_KEY, snapshot()); } catch(e){}
}
function restore(){            // called once on load
  if(!STORAGE_OK) return false;
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if(raw){ const obj = JSON.parse(raw); if(obj && obj.profiles){ STATE = obj; return true; } }
  } catch(e){}
  return false;
}
function loadSnapshot(json){   // used by Import
  try{
    const obj = JSON.parse(json);
    if(obj && obj.profiles){ STATE = obj; save(); return true; }
  }catch(e){}
  return false;
}
function wipe(){               // reset this device
  STATE = freshState();
  if(STORAGE_OK){ try{ window.localStorage.removeItem(STORE_KEY); }catch(e){} }
}

/* ====== Spaced repetition (SM-2, simplified) ====== */
const DAY = 86400000;
function todayStr(){ return new Date().toISOString().slice(0,10); }
function sched(card, grade){ // grade: 0 again, 1 hard, 2 good
  if(!card.ef) card.ef = 2.5;
  if(grade === 0){ card.reps = 0; card.interval = 0; }
  else {
    card.reps = (card.reps||0) + 1;
    if(card.reps === 1) card.interval = 1;
    else if(card.reps === 2) card.interval = grade===1 ? 2 : 4;
    else card.interval = Math.round(card.interval * (grade===1 ? 1.3 : card.ef));
    const q = grade===1 ? 3 : 5;
    card.ef = Math.max(1.3, card.ef + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
  }
  card.due = Date.now() + card.interval*DAY;
  return card;
}
function dueCards(){
  const deck = vocabForLevel(P().level);
  const srs = P().srs;
  const now = Date.now();
  const due = [], fresh = [];
  for(const v of deck){
    const c = srs[v.nl];
    if(!c) fresh.push(v);
    else if(c.due <= now) due.push(v);
  }
  return {due, fresh, total:deck.length,
          learned:Object.keys(srs).filter(k=>deck.find(v=>v.nl===k)).length};
}

/* ====== Streak ====== */
function markStudied(){
  const p = P(), t = todayStr();
  if(p.lastStudy === t) return;
  const y = new Date(Date.now()-DAY).toISOString().slice(0,10);
  p.streak = (p.lastStudy === y) ? p.streak+1 : 1;
  p.lastStudy = t;
}

/* ---- Quiz engine (KNM / Reading / Listening) ---- */
function quizSection(kind){
  const data = kind==="KNM"?KNM : kind==="READING"?READING : LISTENING;
  const passMark = kind==="KNM"?26 : 17; // shown scaled to set length
  let i=0, score=0, answered=false;
  view().innerHTML="";
  const card=h(`<section class="card"><div class="eyebrow">${kind==="KNM"?"KNM · knowledge of Dutch society":kind==="READING"?"Lezen · reading":"Luisteren · listening"}</div><div id="qbody"></div></section>`);
  view().appendChild(card);
  const body=card.querySelector("#qbody");

  function step(){
    answered=false;
    if(i>=data.length){
      const p=P();
      p.quiz[kind]={score, total:data.length, when:todayStr()}; save();
      const realPass = Math.round(passMark/(kind==="KNM"?40:25)*data.length);
      const ok = score>=realPass;
      body.innerHTML=`
        <h2 style="margin:6px 0 8px">Done — ${score}/${data.length}</h2>
        <span class="passbar ${ok?'pass':'fail'}">${ok?'Above':'Below'} the pass mark (≈${realPass}/${data.length} in this set)</span>
        <p class="muted" style="margin-top:12px">On the real exam you need ${kind==="KNM"?"26/40":"17/25"}. This is a short practice set — keep retaking to lock it in.</p>
        <button class="btn block signal" style="margin-top:12px" id="again">Practice again</button>`;
      body.querySelector("#again").onclick=()=>{ i=0;score=0;step(); };
      markStudied(); renderChrome();
      return;
    }
    const it=data[i];
    const passage = kind==="READING" ? `<div class="passage">${it.text}</div>`
      : kind==="LISTENING" ? `<div class="passage" id="tr">🔊 ${it.transcript}</div>
          <button class="btn ghost sm" id="play" style="margin-bottom:12px">▶︎ Play (text-to-speech)</button>` : "";
    const glossSrc = (it.text||"") + " " + (it.transcript||"") + " " + it.q + " " + it.a.join(" ");
    const gl = glossFrom(glossSrc);
    const glossStrip = gl.length ? `<details class="gloss"><summary>Key words (${gl.length})</summary>
        <div class="glist">${gl.map(([n,e])=>`<span class="gitem"><b>${n}</b> ${e}</span>`).join("")}</div></details>` : "";
    body.innerHTML=`
      <div class="tiny" style="margin:4px 0 8px">Question ${i+1} / ${data.length}</div>
      ${passage}
      <h2 style="font-size:16px;margin:0 0 10px">${it.q}</h2>
      ${glossStrip}
      <div id="opts"></div>
      <div id="fb"></div>`;
    if(kind==="LISTENING"){
      const pb=body.querySelector("#play");
      pb.onclick=()=>speak(it.transcript);
    }
    const opts=body.querySelector("#opts");
    it.a.forEach((opt,oi)=>{
      const b=h(`<button class="opt">${opt}</button>`);
      b.onclick=()=>{
        if(answered) return; answered=true;
        const all=opts.querySelectorAll(".opt");
        all.forEach((x,xi)=>{
          if(xi===it.correct) x.classList.add("correct");
          else if(xi===oi) x.classList.add("wrong");
          else x.classList.add("dim");
        });
        if(oi===it.correct) score++;
        body.querySelector("#fb").innerHTML=`<div class="why"><b>${oi===it.correct?'Correct!':'Not quite.'}</b> ${it.why}</div>
          <button class="btn block" style="margin-top:12px" id="nx">${i+1<data.length?'Next →':'Result →'}</button>`;
        body.querySelector("#nx").onclick=()=>{ i++; step(); };
      };
      opts.appendChild(b);
    });
  }
  step();
}

/* Text-to-speech for listening practice (uses device Dutch voice if present) */
function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="nl-NL"; u.rate=.92;
  const nl=speechSynthesis.getVoices().find(v=>v.lang.startsWith("nl"));
  if(nl) u.voice=nl;
  speechSynthesis.speak(u);
}

  view().appendChild(head);

  // direction toggle — repaint list in place, keep search box intact
  head.querySelectorAll("#dirSeg button").forEach(b=>{
    b.classList.toggle("on", b.dataset.dir===WORDS_DIR);
    b.onclick=()=>{
      WORDS_DIR=b.dataset.dir;
      head.querySelectorAll("#dirSeg button").forEach(x=>x.classList.toggle("on",x.dataset.dir===WORDS_DIR));
      paintList();
    };
  });
  const search=head.querySelector("#wsearch");
  search.oninput=()=>{ WORDS_Q=search.value; paintList(); };
  // keep focus + caret after re-render
  setTimeout(()=>{ try{ search.focus(); search.setSelectionRange(search.value.length,search.value.length);}catch(e){} },0);

  const listCard=h(`<section class="card" id="wlist"></section>`);
  view().appendChild(listCard);

  function paintList(){
    const q=WORDS_Q.trim().toLowerCase();
    const lc=document.getElementById("wlist"); if(!lc) return;
    lc.innerHTML="";
    let shown=0;
    order.forEach(topic=>{
      const items=groups[topic].filter(v=>!q || v.nl.toLowerCase().includes(q) || v.en.toLowerCase().includes(q));
      if(!items.length) return;
      lc.appendChild(h(`<div class="eyebrow" style="margin:14px 0 6px">${topic}</div>`));
      items.forEach(v=>{
        shown++;
        const known = srs[v.nl] && srs[v.nl].reps>=2;
        const primary = WORDS_DIR==="nl" ? v.nl : v.en;
        const secondary = WORDS_DIR==="nl" ? v.en : v.nl;
        const row=h(`<div class="wrow">
          <button class="spk" title="Hear it">🔊</button>
          <div class="wpair">
            <span class="wprim">${primary}</span>
            <span class="warrow">→</span>
            <span class="wsec">${secondary}</span>
          </div>
          ${known?'<span class="wknown" title="You know this one">✓</span>':'<span></span>'}
        </div>`);
        row.querySelector(".spk").onclick=()=>speak(v.nl); // always speak the Dutch
        lc.appendChild(row);
      });
    });
    if(!shown) lc.appendChild(h(`<p class="muted" style="margin:10px 0">No words match "${WORDS_Q}".</p>`));
  }
  paintList();
}

/* ---- Roadmap ---- */
function renderPlan(){
  view().innerHTML="";
  const card=h(`<section class="card"><div class="eyebrow">32-week route · A0 → A2</div><h2 style="margin:4px 0 6px">Your plan at 1–2 hrs/week</h2><p class="muted" style="margin:0 0 6px">Tap a leg when you finish it. Realistic for a couple studying together with a March-2027 target.</p></section>`);
  view().appendChild(card);
  ROADMAP.forEach(r=>{
    const done=!!P().roadmapDone[r.wk];
    const leg=h(`<div class="card leg" style="margin-bottom:8px;${done?'opacity:.6':''}">
      <div class="wk">wk ${r.wk}</div>
      <div>
        <div class="focus">${done?'✓ ':''}${r.focus}</div>
        <div class="part">${r.part}</div>
      </div></div>`);
    leg.style.cursor="pointer";
    leg.onclick=()=>{ P().roadmapDone[r.wk]=!done; save(); renderPlan(); };
    view().appendChild(leg);
  });
}

/* ====== Export / import ====== */
function exportSnap(){
  const blob=new Blob([snapshot()],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="dutch-inburgering-progress.json"; a.click();
  URL.revokeObjectURL(url);
}
function importSnap(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ if(loadSnapshot(r.result)){ renderAll(); alert("Backup loaded ✓"); } else alert("Could not read this file."); };
  r.readAsText(f);
}

/* ====== Router ====== */
function renderAll(){
  renderChrome();
  const t=TABS.find(x=>x.id===TAB);
  if(tabLocked(t)){ TAB="home"; }
  switch(TAB){
    case "home": renderHome(); break;
    case "cards": renderCards(); break;
    case "words": renderWords(); break;
    case "knm": quizSection("KNM"); break;
    case "reading": quizSection("READING"); break;
    case "listen": quizSection("LISTENING"); break;
    case "write": renderWrite(); break;
    case "speak": renderSpeak(); break;
    case "plan": renderPlan(); break;
  }
  window.scrollTo({top:0,behavior:"smooth"});
  save();   // persist level/profile/tab and any pending state
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{};
restore();   // load saved progress from this device, if any
renderAll();
</script>
